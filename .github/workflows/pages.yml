name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install & build crawler-showcase
        working-directory: crawler-showcase
        run: |
          npm ci
          npm run build
      - name: Install & build minecraft-demo
        working-directory: minecraft-demo
        run: |
          npm ci
          npm run build
      - name: Assemble static site
        run: |
          mkdir -p staging/minecraft-demo
          cp -r crawler-showcase/dist/* staging/
          cp -r minecraft-demo/dist/* staging/minecraft-demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
